<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">

<defs>

<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#EAF4FF"/>
<stop offset="45%" stop-color="#9CC8F5"/>
<stop offset="100%" stop-color="#294A85"/>
</linearGradient>


<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#FFFCE0"/>
<stop offset="45%" stop-color="#EBCB6A"/>
<stop offset="100%" stop-color="#B07A12"/>
</linearGradient>


<radialGradient id="halo">
<stop offset="0%" stop-color="#FFFFFF" stop-opacity=".75"/>
<stop offset="45%" stop-color="#FFF0B0" stop-opacity=".25"/>
<stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
</radialGradient>


<filter id="glow">
<feGaussianBlur stdDeviation="10"/>
</filter>


</defs>


<!-- Sky background -->

<rect width="512" height="512" rx="110" fill="url(#bg)"/>


<!-- Heavenly light -->

<circle cx="256" cy="170" r="170" fill="url(#halo)"/>


<!-- Soft clouds -->

<path
d="M110 165
Q145 130 180 165
Q210 125 250 165"
fill="none"
stroke="#FFFFFF"
stroke-width="5"
opacity=".25"/>

<path
d="M330 165
Q365 130 400 165"
fill="none"
stroke="#FFFFFF"
stroke-width="5"
opacity=".25"/>


<!-- Bible -->

<path
d="
M170 150
Q256 120 342 150
L342 360
Q256 332 170 360
Z"
fill="none"
stroke="url(#gold)"
stroke-width="18"
stroke-linejoin="round"/>


<!-- Spine -->

<path
d="M256 138V372"
stroke="url(#gold)"
stroke-width="10"
stroke-linecap="round"/>


<!-- Pages -->

<path
d="M256 150Q215 168 188 195"
stroke="#FFFFFFAA"
stroke-width="3"
fill="none"/>

<path
d="M256 150Q297 168 324 195"
stroke="#FFFFFFAA"
stroke-width="3"
fill="none"/>


<!-- Cross -->

<path
d="
M256 185V305
M220 235H292"
stroke="#FFFFFF"
stroke-width="14"
stroke-linecap="round"/>


<!-- Golden heavenly glow -->

<g opacity=".55" filter="url(#glow)">
<path
d="
M256 185V305
M220 235H292"
stroke="#FFD86A"
stroke-width="28"
stroke-linecap="round"/>
</g>


<!-- Light rays -->

<path
d="M256 82V48"
stroke="#FFF4C2"
stroke-width="4"
stroke-linecap="round"/>


<path
d="M210 92L194 65"
stroke="#FFF4C2"
stroke-width="3"
stroke-linecap="round"/>


<path
d="M302 92L318 65"
stroke="#FFF4C2"
stroke-width="3"
stroke-linecap="round"/>


<!-- Floating light particles -->

<circle cx="140" cy="125" r="3" fill="#FFFFFF"/>
<circle cx="370" cy="140" r="3" fill="#FFF4C2"/>
<circle cx="160" cy="300" r="2" fill="#FFFFFF"/>
<circle cx="355" cy="285" r="2" fill="#FFF4C2"/>


</svg>