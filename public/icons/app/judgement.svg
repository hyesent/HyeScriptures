<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">

<defs>

<!-- Fire Background -->

<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#1A0000"/>
<stop offset="35%" stop-color="#4B0900"/>
<stop offset="70%" stop-color="#8A1D00"/>
<stop offset="100%" stop-color="#230000"/>
</linearGradient>

<!-- Molten Gold -->

<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#FFF4B0"/>
<stop offset="45%" stop-color="#FFC84D"/>
<stop offset="100%" stop-color="#C06A00"/>
</linearGradient>

<!-- Heat Glow -->

<radialGradient id="heat">
<stop offset="0%" stop-color="#FFD27A" stop-opacity=".28"/>
<stop offset="60%" stop-color="#FF6B35" stop-opacity=".16"/>
<stop offset="100%" stop-color="#000000" stop-opacity="0"/>
</radialGradient>

<filter id="glow">
<feGaussianBlur stdDeviation="10"/>
</filter>

</defs>

<!-- Background -->

<rect width="512" height="512" rx="110" fill="url(#bg)"/>

<!-- Heat -->

<circle cx="256" cy="180" r="170" fill="url(#heat)"/>

<!-- Smoke -->

<path
d="M80 120
C120 90 170 145 210 115
S310 90 350 120
S430 150 470 110"
fill="none"
stroke="#8A8A8A"
stroke-width="4"
opacity=".10"/>

<!-- Flames -->

<path
d="M90 430
Q120 360 145 420
Q165 350 190 420
Q215 340 245 425
Q270 345 300 425
Q325 355 350 425
Q375 365 410 430"
fill="none"
stroke="#FF8A2A"
stroke-width="5"
stroke-linecap="round"
opacity=".35"/>

<!-- Bible -->

<path
d="
M170 150
Q256 120 342 150
L342 360
Q256 332 170 360
Z"
fill="none"
stroke="url(#gold)"
stroke-width="18"
stroke-linejoin="round"/>

<!-- Spine -->

<path
d="M256 138V372"
stroke="url(#gold)"
stroke-width="10"
stroke-linecap="round"/>

<!-- Pages -->

<path
d="M256 150Q215 168 188 195"
stroke="#FFFFFF66"
stroke-width="3"
fill="none"/>

<path
d="M256 150Q297 168 324 195"
stroke="#FFFFFF66"
stroke-width="3"
fill="none"/>

<!-- Bright Cross -->

<path
d="
M256 185V305
M220 235H292"
stroke="#FFFFFF"
stroke-width="14"
stroke-linecap="round"/>

<!-- Cross Glow -->

<g opacity=".65" filter="url(#glow)">
<path
d="
M256 185V305
M220 235H292"
stroke="#FFE08A"
stroke-width="28"
stroke-linecap="round"/>
</g>

<!-- Embers -->

<circle cx="120" cy="120" r="2" fill="#FFB347"/>
<circle cx="390" cy="140" r="3" fill="#FFD27A"/>
<circle cx="160" cy="305" r="2" fill="#FF7A2A"/>
<circle cx="355" cy="285" r="2" fill="#FFD27A"/>
<circle cx="100" cy="240" r="1.5" fill="#FFB347"/>
<circle cx="420" cy="220" r="2" fill="#FF7A2A"/>

</svg>