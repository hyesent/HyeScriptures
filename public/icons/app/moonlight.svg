<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">

<defs>

<!-- Moonlit Sky -->

<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#07101F"/>
<stop offset="45%" stop-color="#152A4D"/>
<stop offset="100%" stop-color="#04070F"/>
</linearGradient>

<!-- Moon Gold -->

<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#FFF7D8"/>
<stop offset="45%" stop-color="#F3D06D"/>
<stop offset="100%" stop-color="#B07A12"/>
</linearGradient>

<!-- Moon Glow -->

<radialGradient id="moonGlow">
<stop offset="0%" stop-color="#FFFFFF" stop-opacity=".85"/>
<stop offset="60%" stop-color="#CFE3FF" stop-opacity=".22"/>
<stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
</radialGradient>

<filter id="glow">
<feGaussianBlur stdDeviation="10"/>
</filter>

</defs>

<!-- Background -->

<rect
width="512"
height="512"
rx="110"
fill="url(#bg)"/>

<!-- Full Moon -->

<circle
cx="256"
cy="125"
r="72"
fill="#FDFDFD"
opacity=".95"/>

<!-- Moon Halo -->

<circle
cx="256"
cy="125"
r="145"
fill="url(#moonGlow)"/>

<!-- Small Stars -->

<circle cx="95" cy="95" r="2" fill="#FFFFFF"/>
<circle cx="150" cy="70" r="1.5" fill="#FFFFFF"/>
<circle cx="360" cy="75" r="2" fill="#FFFFFF"/>
<circle cx="420" cy="130" r="2" fill="#FFFFFF"/>
<circle cx="100" cy="260" r="2" fill="#CFE3FF"/>
<circle cx="405" cy="315" r="2" fill="#CFE3FF"/>

<!-- Bible -->

<path
d="
M170 150
Q256 120 342 150
L342 360
Q256 332 170 360
Z"
fill="none"
stroke="url(#gold)"
stroke-width="18"
stroke-linejoin="round"/>

<!-- Spine -->

<path
d="M256 138V372"
stroke="url(#gold)"
stroke-width="10"
stroke-linecap="round"/>

<!-- Pages -->

<path
d="M256 150Q215 168 188 195"
stroke="#EAF2FF"
stroke-width="3"
fill="none"/>

<path
d="M256 150Q297 168 324 195"
stroke="#EAF2FF"
stroke-width="3"
fill="none"/>

<!-- Cross -->

<path
d="
M256 185V305
M220 235H292"
stroke="#FFFFFF"
stroke-width="14"
stroke-linecap="round"/>

<!-- Moonlight Glow -->

<g opacity=".55" filter="url(#glow)">
<path
d="
M256 185V305
M220 235H292"
stroke="#D8E9FF"
stroke-width="28"
stroke-linecap="round"/>
</g>

<!-- Soft Moon Beams -->

<path
d="M256 62V38"
stroke="#FFFFFF"
stroke-width="3"
stroke-linecap="round"
opacity=".8"/>

<path
d="M212 75L195 50"
stroke="#FFFFFF"
stroke-width="2.5"
stroke-linecap="round"
opacity=".8"/>

<path
d="M300 75L317 50"
stroke="#FFFFFF"
stroke-width="2.5"
stroke-linecap="round"
opacity=".8"/>

<!-- Floating Light Dust -->

<circle cx="150" cy="305" r="2.5" fill="#FFFFFF"/>
<circle cx="360" cy="285" r="2" fill="#EAF2FF"/>
<circle cx="175" cy="185" r="1.8" fill="#CFE3FF"/>
<circle cx="340" cy="170" r="1.8" fill="#CFE3FF"/>

</svg>