<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">

<defs>

<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#22000D"/>
<stop offset="45%" stop-color="#6B1638"/>
<stop offset="100%" stop-color="#170009"/>
</linearGradient>


<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#FFF3C0"/>
<stop offset="45%" stop-color="#F4CE68"/>
<stop offset="100%" stop-color="#A86C0B"/>
</linearGradient>


<radialGradient id="halo">
<stop offset="0%" stop-color="#FFD98A" stop-opacity=".35"/>
<stop offset="45%" stop-color="#FF7AA8" stop-opacity=".16"/>
<stop offset="100%" stop-color="#000000" stop-opacity="0"/>
</radialGradient>


<filter id="glow">
<feGaussianBlur stdDeviation="10"/>
</filter>


</defs>


<!-- Rose velvet background -->

<rect width="512" height="512" rx="110" fill="url(#bg)"/>


<!-- Warm rose light -->

<circle cx="256" cy="180" r="160" fill="url(#halo)"/>


<!-- Rose petals -->

<path
d="M125 170
Q105 130 150 120
Q165 150 125 170"
fill="none"
stroke="#FFB4C9"
stroke-width="3"
opacity=".35"/>


<path
d="M387 170
Q407 130 362 120
Q347 150 387 170"
fill="none"
stroke="#FFB4C9"
stroke-width="3"
opacity=".35"/>


<!-- Bible -->

<path
d="
M170 150
Q256 120 342 150
L342 360
Q256 332 170 360
Z"
fill="none"
stroke="url(#gold)"
stroke-width="18"
stroke-linejoin="round"/>


<!-- Spine -->

<path
d="M256 138V372"
stroke="url(#gold)"
stroke-width="10"
stroke-linecap="round"/>


<!-- Pages -->

<path
d="M256 150Q215 168 188 195"
stroke="#FFFFFF66"
stroke-width="3"
fill="none"/>


<path
d="M256 150Q297 168 324 195"
stroke="#FFFFFF66"
stroke-width="3"
fill="none"/>


<!-- Cross -->

<path
d="
M256 185V305
M220 235H292"
stroke="white"
stroke-width="14"
stroke-linecap="round"/>


<!-- Rose gold glow -->

<g opacity=".55" filter="url(#glow)">
<path
d="
M256 185V305
M220 235H292"
stroke="#FFD86A"
stroke-width="28"
stroke-linecap="round"/>
</g>


<!-- Rays -->

<path
d="M256 78V48"
stroke="#FFE59B"
stroke-width="4"
stroke-linecap="round"/>


<path
d="M210 92L195 65"
stroke="#FFE59B"
stroke-width="3"
stroke-linecap="round"/>


<path
d="M302 92L317 65"
stroke="#FFE59B"
stroke-width="3"
stroke-linecap="round"/>


<!-- Petal particles -->

<circle cx="145" cy="125" r="3" fill="#FFD6E0"/>
<circle cx="370" cy="140" r="2" fill="#FFE89B"/>
<circle cx="160" cy="300" r="2" fill="#FFFFFF"/>
<circle cx="355" cy="285" r="3" fill="#FFD6E0"/>


</svg>