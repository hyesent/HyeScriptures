<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">

<defs>

<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#031B12"/>
<stop offset="45%" stop-color="#06452B"/>
<stop offset="100%" stop-color="#012016"/>
</linearGradient>


<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#FFF5C7"/>
<stop offset="45%" stop-color="#F5D267"/>
<stop offset="100%" stop-color="#A87410"/>
</linearGradient>


<radialGradient id="halo">
<stop offset="0%" stop-color="#FFE59B" stop-opacity=".3"/>
<stop offset="50%" stop-color="#7CFFB2" stop-opacity=".12"/>
<stop offset="100%" stop-color="#000000" stop-opacity="0"/>
</radialGradient>


<filter id="glow">
<feGaussianBlur stdDeviation="10"/>
</filter>

</defs>


<!-- Eden background -->

<rect width="512" height="512" rx="110" fill="url(#bg)"/>


<!-- Divine garden light -->

<circle cx="256" cy="180" r="160" fill="url(#halo)"/>


<!-- Leaves -->

<path
d="M120 170 Q95 120 150 105 Q155 150 120 170"
fill="none"
stroke="#A8E6B0"
stroke-width="3"
opacity=".4"/>

<path
d="M392 170 Q417 120 362 105 Q357 150 392 170"
fill="none"
stroke="#A8E6B0"
stroke-width="3"
opacity=".4"/>


<!-- Bible -->

<path
d="
M170 150
Q256 120 342 150
L342 360
Q256 332 170 360
Z"
fill="none"
stroke="url(#gold)"
stroke-width="18"
stroke-linejoin="round"/>


<!-- Spine -->

<path
d="M256 138V372"
stroke="url(#gold)"
stroke-width="10"
stroke-linecap="round"/>


<!-- Pages -->

<path
d="M256 150Q215 168 188 195"
stroke="#FFFFFF66"
stroke-width="3"
fill="none"/>

<path
d="M256 150Q297 168 324 195"
stroke="#FFFFFF66"
stroke-width="3"
fill="none"/>


<!-- Cross -->

<path
d="
M256 185V305
M220 235H292"
stroke="white"
stroke-width="14"
stroke-linecap="round"/>


<!-- Green-gold divine glow -->

<g opacity=".5" filter="url(#glow)">
<path
d="
M256 185V305
M220 235H292"
stroke="#FFD86A"
stroke-width="26"
stroke-linecap="round"/>
</g>


<!-- Sun rays -->

<path
d="M256 78V48"
stroke="#FFE59B"
stroke-width="4"
stroke-linecap="round"/>

<path
d="M210 92L195 65"
stroke="#FFE59B"
stroke-width="3"
stroke-linecap="round"/>

<path
d="M302 92L317 65"
stroke="#FFE59B"
stroke-width="3"
stroke-linecap="round"/>


<!-- Nature particles -->

<circle cx="145" cy="125" r="3" fill="#DFFF9B"/>
<circle cx="370" cy="140" r="2" fill="#DFFF9B"/>
<circle cx="160" cy="300" r="2" fill="#FFFFFF"/>
<circle cx="355" cy="285" r="3" fill="#FFFFFF"/>


</svg>