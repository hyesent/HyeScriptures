<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">

<defs>

<!-- Amethyst Background -->

<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#1A0B38"/>
<stop offset="45%" stop-color="#5A2D91"/>
<stop offset="100%" stop-color="#0E051D"/>
</linearGradient>

<!-- Champagne Gold -->

<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#FFF8D8"/>
<stop offset="45%" stop-color="#F4CF6B"/>
<stop offset="100%" stop-color="#B47A12"/>
</linearGradient>

<!-- Crystal Glow -->

<radialGradient id="light">
<stop offset="0%" stop-color="#FFFFFF" stop-opacity=".35"/>
<stop offset="45%" stop-color="#D9B3FF" stop-opacity=".22"/>
<stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
</radialGradient>

<filter id="glow">
<feGaussianBlur stdDeviation="10"/>
</filter>

</defs>

<!-- Background -->

<rect
width="512"
height="512"
rx="110"
fill="url(#bg)"/>

<!-- Crystal Light -->

<circle
cx="256"
cy="175"
r="165"
fill="url(#light)"/>

<!-- Crystal Facets -->

<path
d="M90 105L170 55L240 135L150 185Z"
fill="#FFFFFF"
opacity=".08"/>

<path
d="M320 70L435 125L350 210L265 125Z"
fill="#FFFFFF"
opacity=".08"/>

<path
d="M120 330L210 270L255 390L145 435Z"
fill="#FFFFFF"
opacity=".06"/>

<path
d="M305 295L425 250L440 390L325 435Z"
fill="#FFFFFF"
opacity=".06"/>

<!-- Bible -->

<path
d="
M170 150
Q256 120 342 150
L342 360
Q256 332 170 360
Z"
fill="none"
stroke="url(#gold)"
stroke-width="18"
stroke-linejoin="round"/>

<!-- Spine -->

<path
d="M256 138V372"
stroke="url(#gold)"
stroke-width="10"
stroke-linecap="round"/>

<!-- Pages -->

<path
d="M256 150Q215 168 188 195"
stroke="#FFFFFFAA"
stroke-width="3"
fill="none"/>

<path
d="M256 150Q297 168 324 195"
stroke="#FFFFFFAA"
stroke-width="3"
fill="none"/>

<!-- Cross -->

<path
d="
M256 185V305
M220 235H292"
stroke="#FFFFFF"
stroke-width="14"
stroke-linecap="round"/>

<!-- Amethyst Glow -->

<g opacity=".55" filter="url(#glow)">
<path
d="
M256 185V305
M220 235H292"
stroke="#DDB8FF"
stroke-width="28"
stroke-linecap="round"/>
</g>

<!-- Rays -->

<path
d="M256 78V48"
stroke="#FFF2C0"
stroke-width="4"
stroke-linecap="round"/>

<path
d="M210 90L194 65"
stroke="#FFF2C0"
