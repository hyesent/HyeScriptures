stroke-linecap="round"/>

<path
d="M302 90L318 65"
stroke="#FFF2C0"
stroke-width="3"
stroke-linecap="round"/>

<!-- Crystal Sparkles -->

<path
d="M130 115l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"
fill="#FFFFFF"
opacity=".9"/>

<path
