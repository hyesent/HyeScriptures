<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">

<defs>

<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#000000"/>
<stop offset="50%" stop-color="#080B12"/>
<stop offset="100%" stop-color="#1A1D25"/>
</linearGradient>


<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#FFF5C4"/>
<stop offset="45%" stop-color="#F4D066"/>
<stop offset="100%" stop-color="#A36A08"/>
</linearGradient>


<radialGradient id="halo">
<stop offset="0%" stop-color="#FFD86A" stop-opacity=".25"/>
<stop offset="45%" stop-color="#FFFFFF" stop-opacity=".05"/>
<stop offset="100%" stop-color="#000000" stop-opacity="0"/>
</radialGradient>


<filter id="glow">
<feGaussianBlur stdDeviation="11"/>
</filter>


</defs>


<!-- Midnight background -->

<rect width="512" height="512" rx="110" fill="url(#bg)"/>


<!-- Moonlight -->

<circle cx="256" cy="175" r="160" fill="url(#halo)"/>


<!-- Moon -->

<circle
cx="365"
cy="110"
r="28"
fill="none"
stroke="#FFE89B"
stroke-width="3"
opacity=".45"/>


<!-- Stars -->

<circle cx="110" cy="130" r="2" fill="#FFFFFF"/>
<circle cx="145" cy="95" r="3" fill="#FFE89B"/>
<circle cx="390" cy="180" r="2" fill="#FFFFFF"/>
<circle cx="370" cy="330" r="3" fill="#FFE89B"/>


<!-- Bible -->

<path
d="
M170 150
Q256 120 342 150
L342 360
Q256 332 170 360
Z"
fill="none"
stroke="url(#gold)"
stroke-width="18"
stroke-linejoin="round"/>


<!-- Spine -->

<path
d="M256 138V372"
stroke="url(#gold)"
stroke-width="10"
stroke-linecap="round"/>


<!-- Pages -->

<path
d="M256 150Q215 168 188 195"
stroke="#FFFFFF55"
stroke-width="3"
fill="none"/>


<path
d="M256 150Q297 168 324 195"
stroke="#FFFFFF55"
stroke-width="3"
fill="none"/>


<!-- Cross -->

<path
d="
M256 185V305
M220 235H292"
stroke="#FFFFFF"
stroke-width="14"
stroke-linecap="round"/>


<!-- Gold night glow -->

<g opacity=".55" filter="url(#glow)">
<path
d="
M256 185V305
M220 235H292"
stroke="#FFD86A"
stroke-width="28"
stroke-linecap="round"/>
</g>


<!-- Small rays -->

<path
d="M256 78V50"
stroke="#FFE59B"
stroke-width="4"
stroke-linecap="round"/>


<path
d="M210 90L195 65"
stroke="#FFE59B"
stroke-width="3"
stroke-linecap="round"/>


<path
d="M302 90L317 65"
stroke="#FFE59B"
stroke-width="3"
stroke-linecap="round"/>


<!-- Light particles -->

<circle cx="150" cy="290" r="2" fill="#FFE89B"/>
<circle cx="350" cy="270" r="2" fill="#FFE89B"/>
<circle cx="165" cy="160" r="2" fill="#FFFFFF"/>
<circle cx="340" cy="150" r="2" fill="#FFFFFF"/>


</svg>