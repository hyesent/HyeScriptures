<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">

<defs>

<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#021A22"/>
<stop offset="45%" stop-color="#064B57"/>
<stop offset="100%" stop-color="#001018"/>
</linearGradient>


<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#FFF6C7"/>
<stop offset="45%" stop-color="#F3CF63"/>
<stop offset="100%" stop-color="#9A6508"/>
</linearGradient>


<radialGradient id="halo">
<stop offset="0%" stop-color="#FFF0A6" stop-opacity=".35"/>
<stop offset="45%" stop-color="#42D9D0" stop-opacity=".18"/>
<stop offset="100%" stop-color="#000000" stop-opacity="0"/>
</radialGradient>


<filter id="glow">
<feGaussianBlur stdDeviation="10"/>
</filter>


</defs>


<!-- Ocean background -->

<rect width="512" height="512" rx="110" fill="url(#bg)"/>


<!-- Deep ocean light -->

<circle cx="256" cy="175" r="160" fill="url(#halo)"/>


<!-- Wave details -->

<path
d="M90 150 Q160 120 230 150 T420 150"
fill="none"
stroke="#7BE6E0"
stroke-width="3"
opacity=".25"/>


<path
d="M90 340 Q160 310 230 340 T420 340"
fill="none"
stroke="#7BE6E0"
stroke-width="3"
opacity=".2"/>


<!-- Bible -->

<path
d="
M170 150
Q256 120 342 150
L342 360
Q256 332 170 360
Z"
fill="none"
stroke="url(#gold)"
stroke-width="18"
stroke-linejoin="round"/>


<!-- Spine -->

<path
d="M256 138V372"
stroke="url(#gold)"
stroke-width="10"
stroke-linecap="round"/>


<!-- Pages -->

<path
d="M256 150Q215 168 188 195"
stroke="#FFFFFF66"
stroke-width="3"
fill="none"/>


<path
d="M256 150Q297 168 324 195"
stroke="#FFFFFF66"
stroke-width="3"
fill="none"/>


<!-- Cross -->

<path
d="
M256 185V305
M220 235H292"
stroke="white"
stroke-width="14"
stroke-linecap="round"/>


<!-- Golden reflection glow -->

<g opacity=".55" filter="url(#glow)">
<path
d="
M256 185V305
M220 235H292"
stroke="#FFD86A"
stroke-width="28"
stroke-linecap="round"/>
</g>


<!-- Light rays -->

<path
d="M256 78V48"
stroke="#FFE59B"
stroke-width="4"
stroke-linecap="round"/>


<path
d="M210 92L195 65"
stroke="#FFE59B"
stroke-width="3"
stroke-linecap="round"/>


<path
d="M302 92L317 65"
stroke="#FFE59B"
stroke-width="3"
stroke-linecap="round"/>


<!-- Ocean particles -->

<circle cx="145" cy="120" r="3" fill="#8FF5E8"/>
<circle cx="370" cy="140" r="2" fill="#FFE89B"/>
<circle cx="160" cy="300" r="2" fill="#FFFFFF"/>
<circle cx="355" cy="285" r="3" fill="#8FF5E8"/>


</svg>