<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">

<defs>

<!-- Aurora Night Sky -->
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#04111D"/>
<stop offset="40%" stop-color="#0A2A44"/>
<stop offset="100%" stop-color="#170B38"/>
</linearGradient>

<!-- Gold Bible -->
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#FFF4B8"/>
<stop offset="50%" stop-color="#F6D067"/>
<stop offset="100%" stop-color="#B98510"/>
</linearGradient>

<!-- Aurora Glow -->
<radialGradient id="light">
<stop offset="0%" stop-color="#FFFFFF" stop-opacity=".18"/>
<stop offset="40%" stop-color="#5FFFD6" stop-opacity=".18"/>
<stop offset="70%" stop-color="#6CA6FF" stop-opacity=".12"/>
<stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
</radialGradient>

<!-- Aurora Ribbon -->
<linearGradient id="aurora" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#7BFFD8"/>
<stop offset="35%" stop-color="#52E5FF"/>
<stop offset="70%" stop-color="#7E7BFF"/>
<stop offset="100%" stop-color="#D783FF"/>
</linearGradient>

<filter id="blur">
<feGaussianBlur stdDeviation="18"/>
</filter>

<filter id="glow">
<feGaussianBlur stdDeviation="8"/>
</filter>

</defs>

<!-- Background -->

<rect width="512" height="512" rx="110" fill="url(#bg)"/>

<!-- Aurora -->

<path
d="
M-40 130
C60 70 150 180 260 120
S430 80 560 150
L560 230
L-40 230Z"
fill="url(#aurora)"
opacity=".28"
filter="url(#blur)"
/>

<path
d="
M-40 210
C70 150 160 250 260 200
S420 170 560 220
L560 290
L-40 290Z"
fill="url(#aurora)"
opacity=".18"
filter="url(#blur)"
/>

<!-- Light -->

<circle cx="256" cy="175" r="145" fill="url(#light)"/>

<!-- Bible -->

<path
d="
M170 150
Q256 120 342 150
L342 360
Q256 332 170 360
Z"
fill="none"
stroke="url(#gold)"
stroke-width="18"
stroke-linejoin="round"/>

<!-- Spine -->

<path
d="M256 138L256 372"
stroke="url(#gold)"
stroke-width="10"
stroke-linecap="round"/>

<!-- Pages -->

<path
d="
M256 150
Q215 168 188 195"
stroke="#FFFFFF66"
stroke-width="3"
fill="none"/>

<path
d="
M256 150
Q297 168 324 195"
stroke="#FFFFFF66"
stroke-width="3"
fill="none"/>

<!-- Cross -->

<path
d="
M256 185
L256 305

M220 235
L292 235"
stroke="white"
stroke-width="14"
stroke-linecap="round"/>

<!-- Cross Glow -->

<g opacity=".5" filter="url(#glow)">
<path
d="
M256 185
L256 305

M220 235
L292 235"
stroke="#B7FFF5"
stroke-width="22"
stroke-linecap="round"/>
</g>

<!-- Rays -->

<path
d="M256 78L256 50"
stroke="#FFF2B0"
stroke-width="4"
stroke-linecap="round"/>

<path
d="M208 90L194 64"
stroke="#FFF2B0"
stroke-width="3"
stroke-linecap="round"/>

<path
d="M304 90L318 64"
stroke="#FFF2B0"
stroke-width="3"
stroke-linecap="round"/>

<!-- Stars -->

<circle cx="120" cy="90" r="2" fill="#FFFFFF"/>
<circle cx="395" cy="120" r="2" fill="#FFFFFF"/>
<circle cx="160" cy="305" r="2" fill="#7BFFD8"/>
<circle cx="350" cy="285" r="2" fill="#7E7BFF"/>
<circle cx="95" cy="220" r="1.8" fill="#FFFFFF"/>
<circle cx="420" cy="245" r="2" fill="#D9AFFF"/>
<circle cx="320" cy="75" r="1.8" fill="#FFFFFF"/>

</svg>