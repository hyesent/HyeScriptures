<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">

<defs>

<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#08111F"/>
<stop offset="100%" stop-color="#132D5C"/>
</linearGradient>

<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#FFF1B2"/>
<stop offset="50%" stop-color="#F6D067"/>
<stop offset="100%" stop-color="#BD8A12"/>
</linearGradient>

<radialGradient id="light">
<stop offset="0%" stop-color="#FFFFFF" stop-opacity=".22"/>
<stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
</radialGradient>

<filter id="glow">
<feGaussianBlur stdDeviation="8"/>
</filter>

</defs>

<rect width="512" height="512" rx="110" fill="url(#bg)"/>

<circle cx="256" cy="175" r="135" fill="url(#light)"/>

<!-- Bible -->

<path
d="
M170 150
Q256 120 342 150
L342 360
Q256 332 170 360
Z"
fill="none"
stroke="url(#gold)"
stroke-width="18"
stroke-linejoin="round"/>

<!-- Spine -->

<path
d="
M256 138
L256 372"
stroke="url(#gold)"
stroke-width="10"
stroke-linecap="round"/>

<!-- Pages -->

<path
d="
M256 150
Q215 168 188 195"
stroke="#ffffff66"
stroke-width="3"
fill="none"/>

<path
d="
M256 150
Q297 168 324 195"
stroke="#ffffff66"
stroke-width="3"
fill="none"/>

<!-- Cross -->

<path
d="
M256 185
L256 305

M220 235
L292 235"
stroke="white"
stroke-width="14"
stroke-linecap="round"/>

<!-- Glow -->

<g opacity=".45" filter="url(#glow)">
<path
d="
M256 185
L256 305

M220 235
L292 235"
stroke="#FFD86A"
stroke-width="22"
stroke-linecap="round"/>
</g>

<!-- Rays -->

<path d="M256 78 L256 52"
stroke="#FFE59B"
stroke-width="4"
stroke-linecap="round"/>

<path d="M208 90 L195 66"
stroke="#FFE59B"
stroke-width="3"
stroke-linecap="round"/>

<path d="M304 90 L317 66"
stroke="#FFE59B"
stroke-width="3"
stroke-linecap="round"/>

<!-- Stars -->

<circle cx="145" cy="120" r="2" fill="#FFE89B"/>
<circle cx="368" cy="135" r="3" fill="#FFE89B"/>
<circle cx="160" cy="300" r="2" fill="#FFE89B"/>
<circle cx="356" cy="286" r="2" fill="#FFE89B"/>

</svg>