<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">

<defs>

<!-- Sunrise Sky -->

<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#FFDFA3"/>
<stop offset="35%" stop-color="#FFB45C"/>
<stop offset="70%" stop-color="#F57C35"/>
<stop offset="100%" stop-color="#7C2D12"/>
</linearGradient>

<!-- Gold Bible -->

<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#FFFBE0"/>
<stop offset="45%" stop-color="#F9D76E"/>
<stop offset="100%" stop-color="#B7790A"/>
</linearGradient>

<!-- Sun Glow -->

<radialGradient id="sunGlow">
<stop offset="0%" stop-color="#FFFFFF" stop-opacity=".9"/>
<stop offset="35%" stop-color="#FFF3B8" stop-opacity=".55"/>
<stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
</radialGradient>

<filter id="glow">
<feGaussianBlur stdDeviation="10"/>
</filter>

</defs>

<!-- Background -->

<rect
width="512"
height="512"
rx="110"
fill="url(#bg)"/>

<!-- Sun -->

<circle
cx="256"
cy="118"
r="58"
fill="#FFF8D5"/>

<!-- Sun Halo -->

<circle
cx="256"
cy="118"
r="155"
fill="url(#sunGlow)"/>

<!-- Sun Rays -->

<g opacity=".35">

<path d="M256 18V55"
stroke="#FFF7C8"
stroke-width="5"
stroke-linecap="round"/>

<path d="M182 42L205 70"
stroke="#FFF7C8"
stroke-width="4"
stroke-linecap="round"/>

<path d="M330 42L307 70"
stroke="#FFF7C8"
stroke-width="4"
stroke-linecap="round"/>

<path d="M155 118H190"
stroke="#FFF7C8"
stroke-width="4"
stroke-linecap="round"/>

<path d="M322 118H357"
stroke="#FFF7C8"
stroke-width="4"
stroke-linecap="round"/>

</g>

<!-- Soft Clouds -->

<path
d="M120 150
Q150 125 180 150
Q210 130 240 150"
fill="none"
stroke="#FFFFFF"
stroke-width="4"
opacity=".25"/>

<path
d="M272 150
Q305 125 340 150
Q370 130 400 150"
fill="none"
stroke="#FFFFFF"
stroke-width="4"
opacity=".25"/>

<!-- Bible -->

<path
d="
M170 150
Q256 120 342 150
L342 360
Q256 332 170 360
Z"
fill="none"
stroke="url(#gold)"
stroke-width="18"
stroke-linejoin="round"/>

<!-- Spine -->

<path
d="M256 138V372"
stroke="url(#gold)"
stroke-width="10"
stroke-linecap="round"/>

<!-- Pages -->

<path
d="M256 150Q215 168 188 195"
stroke="#FFF8E8"
stroke-width="3"
fill="none"/>

<path
d="M256 150Q297 168 324 195"
stroke="#FFF8E8"
stroke-width="3"
fill="none"/>

<!-- Cross -->

<path
d="
M256 185V305
M220 235H292"
stroke="#FFFFFF"
stroke-width="14"
stroke-linecap="round"/>

<!-- Warm Glow -->

<g opacity=".55" filter="url(#glow)">
<path
d="
M256 185V305
M220 235H292"
stroke="#FFE082"
stroke-width="30"
stroke-linecap="round"/>
</g>

<!-- Sparkles -->

<circle cx="130" cy="95" r="2" fill="#FFFFFF"/>
<circle cx="380" cy="92" r="2" fill="#FFFFFF"/>
<circle cx="160" cy="305" r="2" fill="#FFF6CC"/>
<circle cx="350" cy="290" r="2" fill="#FFF6CC"/>

</svg>