<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hyescriptures - Offline</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #fcfbf8;
      color: #1a1a2e;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 400px;
      text-align: center;
      padding: 40px 20px;
    }
    .icon {
      font-size: 80px;
      margin-bottom: 20px;
      display: block;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 8px;
    }
    p {
      font-size: 16px;
      color: #666;
      line-height: 1.6;
      margin-bottom: 16px;
    }
    .button {
      display: inline-block;
      padding: 12px 32px;
      background: #b8860b;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.2s;
    }
    .button:hover {
      background: #8b6b0b;
    }
    .features {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #e8e4dd;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .feature {
      font-size: 13px;
      color: #999;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .feature span {
      font-size: 24px;
    }
  </style>
</head>
<body>
  <div class="container">
    <span class="icon">📖</span>
    <h1>Hyescriptures</h1>
    <p>You're offline, but the Word is still with you.</p>
    <p style="font-size: 14px; color: #999;">Your Bible, bookmarks, and notes are available offline.</p>
    <a href="/" class="button">Go to Home</a>
    
    <div class="features">
      <div class="feature">
        <span>📖</span>
        Full Bible
      </div>
      <div class="feature">
        <span>🔍</span>
        Search
      </div>
      <div class="feature">
        <span>⭐</span>
        Bookmarks
      </div>
      <div class="feature">
        <span>📝</span>
        Notes
      </div>
    </div>
  </div>
</body>
</html>
